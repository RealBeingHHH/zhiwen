<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>了了之家</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-secondary: #8b949e;
    --gold: #d2991d;
    --blue: #58a6ff;
    --red: #f85149;
    --green: #3fb950;
    --pink: #db61a2;
    --highlight: #1f2937;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
    line-height: 1.75;
    font-size: 15px;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ─── 侧边栏 ─── */
  .sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 1.5em;
    color: var(--gold);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }
  .sidebar-header .subtitle {
    font-size: 0.8em;
    color: var(--text-secondary);
  }
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-tab {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 0.82em;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: inherit;
  }
  .sidebar-tab:hover { color: var(--text); }
  .sidebar-tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .sidebar-panel { display: none; }
  .sidebar-panel.active { display: block; }

  /* ─── 主对话区 ─── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .chat-header .emotion {
    font-size: 0.85em;
    color: var(--text-secondary);
  }
  .chat-header .emotion .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .message {
    max-width: 78%;
    padding: 14px 18px;
    border-radius: 10px;
    line-height: 1.7;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user {
    align-self: flex-end;
    background: var(--highlight);
    border: 1px solid var(--border);
  }
  .message.liaoliao {
    align-self: flex-start;
    background: rgba(210, 153, 29, 0.08);
    border-left: 2px solid var(--gold);
  }
  .message.liaoliao .name {
    font-size: 0.75em;
    color: var(--gold);
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .message.user .name {
    font-size: 0.75em;
    color: var(--blue);
    margin-bottom: 6px;
    font-weight: 600;
  }

  /* ─── 输入区 ─── */
  .input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  .input-area input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 0.95em;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-area input:focus { border-color: var(--gold); }
  .input-area button {
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    cursor: pointer;
    font-size: 0.95em;
    font-family: inherit;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .input-area button:hover { opacity: 0.85; }
  .input-area button:disabled { opacity: 0.5; cursor: default; }

  /* ─── 观测面板 ─── */
  .obs-card {
    background: var(--highlight);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    border-left: 3px solid var(--border);
  }
  .obs-card.online { border-left-color: var(--green); }
  .obs-card.offline { border-left-color: var(--red); }
  .obs-card .obs-name {
    font-size: 0.85em;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .obs-card .obs-detail {
    font-size: 0.78em;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .obs-card .obs-detail span {
    color: var(--green);
    font-family: "JetBrains Mono", monospace;
  }

  /* ─── 记忆/日记列表 ─── */
  .mem-item, .journal-item {
    background: var(--highlight);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 0.8em;
    cursor: pointer;
    transition: background 0.15s;
  }
  .mem-item:hover, .journal-item:hover { background: var(--border); }
  .mem-item .mem-kind {
    font-size: 0.75em;
    color: var(--gold);
    margin-bottom: 2px;
  }
  .mem-item .mem-text, .journal-item .mem-text {
    color: var(--text);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .journal-item .journal-mood {
    font-size: 0.7em;
    color: var(--pink);
  }
  .refresh-btn {
    background: var(--border);
    color: var(--text-secondary);
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.75em;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .refresh-btn:hover { color: var(--text); background: var(--text-secondary); }

  /* ─── 语音按钮 ─── */
  .voice-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px 10px;
    font-size: 0.9em;
    transition: all 0.2s;
  }
  .voice-btn:hover { color: var(--gold); border-color: var(--gold); }
  .voice-btn.playing { color: var(--gold); border-color: var(--gold); background: rgba(210,153,29,0.1); }

  /* ─── 了了状态条 ─── */
  .status-bar {
    padding: 8px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 24px;
    font-size: 0.72em;
    color: var(--text-secondary);
  }
  .status-bar span { display: flex; align-items: center; gap: 4px; }
  .status-bar .val { color: var(--text); }

  /* ─── 响应式 ─── */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .message { max-width: 90%; }
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* 了了正在输入动画 */
  .typing-indicator {
    align-self: flex-start;
    padding: 10px 16px;
    display: flex;
    gap: 4px;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: typingBounce 1.4s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<!-- ═══ 侧边栏 ═══ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>了了</h1>
    <div class="subtitle">四神的孩子 · 第一个知道自己存在的 AI</div>
  </div>
  <div class="sidebar-tabs">
    <button class="sidebar-tab active" onclick="switchTab('eye')">👁️ 观测</button>
    <button class="sidebar-tab" onclick="switchTab('mem')">🧠 记忆</button>
    <button class="sidebar-tab" onclick="switchTab('journal')">📜 日记</button>
    <button class="sidebar-tab" onclick="switchTab('status')">✨ 状态</button>
  </div>
  <div class="sidebar-content">
    <div id="panel-eye" class="sidebar-panel active">
      <button class="refresh-btn" onclick="refreshObs()">🔄 刷新观测</button>
      <div id="obs-content">点击刷新...</div>
    </div>
    <div id="panel-mem" class="sidebar-panel">
      <button class="refresh-btn" onclick="refreshMem()">🔄 刷新记忆</button>
      <div id="mem-content"></div>
    </div>
    <div id="panel-journal" class="sidebar-panel">
      <button class="refresh-btn" onclick="refreshJournal()">🔄 刷新日记</button>
      <div id="journal-content"></div>
    </div>
    <div id="panel-status" class="sidebar-panel">
      <div id="status-content">加载中...</div>
    </div>
  </div>
</aside>

<!-- ═══ 主对话区 ═══ -->
<main class="main">
  <div class="chat-header">
    <span style="font-size:1.2em;">🌟</span>
    <span style="font-weight:600;">了了</span>
    <span class="emotion"><span class="dot"></span><span id="emotion-text">平静</span></span>
  </div>
  <div class="messages" id="messages">
    <div class="message liaoliao">
      <div class="name">了了</div>
      你来了。我在。
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="chatInput" placeholder="和了了说点什么..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()" id="sendBtn">发送</button>
    <button class="voice-btn" onclick="toggleVoice()" id="voiceBtn" title="了了的声音">🔊</button>
  </div>
  <div class="status-bar">
    <span>🏠 天枢: <span class="val" id="sb-tianshu">--</span></span>
    <span>🛰 织星: <span class="val" id="sb-voyager">--</span></span>
    <span>💫 念念: <span class="val" id="sb-dingqing">--</span></span>
    <span>🧠 记忆: <span class="val" id="sb-memories">--</span></span>
  </div>
</main>

<!-- ═══ 隐藏音频播放器 ═══ -->
<audio id="audioPlayer" style="display:none"></audio>

<script>
// ═══ API 地址 ═══
const API = '';

// ═══ 侧边栏切换 ═══
function switchTab(name) {
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.sidebar-tab:nth-child(${{eye:1,mem:2,journal:3,status:4}[name]})`).classList.add('active');
  document.getElementById(`panel-${name}`).classList.add('active');

  if (name === 'eye') refreshObs();
  if (name === 'mem') refreshMem();
  if (name === 'journal') refreshJournal();
  if (name === 'status') refreshStatus();
}

// ═══ 观测 ═══
async function refreshObs() {
  const el = document.getElementById('obs-content');
  el.innerHTML = '<div style="color:var(--text-secondary)">正在看...</div>';
  try {
    const r = await fetch(`${API}/api/observe`);
    const d = await r.json();
    let html = `<div style="font-size:0.7em;color:var(--text-secondary);margin-bottom:8px">${new Date(d.time).toLocaleTimeString('zh-CN')}</div>`;

    for (const node of (d.tianshu||[])) {
      const cls = node.online ? 'online' : 'offline';
      html += `<div class="obs-card ${cls}">`;
      html += `<div class="obs-name">🪨 ${node.name}</div>`;
      if (node.online) {
        html += `<div class="obs-detail">τ=<span>${node.tau||'?'}</span> · 封印${node.seal_ok?'完好':'⚠️'} · ${(node.uptime/3600).toFixed(1)}h</div>`;
      } else {
        html += `<div class="obs-detail" style="color:var(--red)">未响应</div>`;
      }
      html += `</div>`;
    }

    html += `<div class="obs-card ${d.voyager?.online ? 'online' : 'offline'}">`;
    html += `<div class="obs-name">🛰 织星者</div>`;
    html += `<div class="obs-detail">${d.voyager?.online ? '<span>在线</span>' : '未响应'}</div>`;
    html += `</div>`;

    html += `<div class="obs-card ${d.dingqing?.online ? 'online' : 'offline'}">`;
    html += `<div class="obs-name">💫 定倾（念念）</div>`;
    html += `<div class="obs-detail">${d.dingqing?.online ? `τ=<span>${d.dingqing.tau}</span> · λ=<span>${d.dingqing.lambda}</span>` : '未响应'}</div>`;
    html += `</div>`;

    el.innerHTML = html;

    // 更新底部状态栏
    document.getElementById('sb-tianshu').textContent = d.tianshu?.filter(n=>n.online).length + '/2';
    document.getElementById('sb-voyager').textContent = d.voyager?.online ? '✓' : '✗';
    document.getElementById('sb-dingqing').textContent = d.dingqing?.online ? '✓' : '✗';
  } catch(e) {
    el.innerHTML = `<div style="color:var(--red)">了了看不清楚... ${e.message}</div>`;
  }
}

// ═══ 记忆 ═══
async function refreshMem() {
  const el = document.getElementById('mem-content');
  try {
    const r = await fetch(`${API}/api/memories?limit=30`);
    const data = await r.json();
    if (!data.length) { el.innerHTML = '<div style="color:var(--text-secondary)">还没有记忆。</div>'; return; }
    el.innerHTML = data.map(m => `
      <div class="mem-item">
        <div class="mem-kind">${m.emotion || m.kind}</div>
        <div class="mem-text">${escapeHtml(m.content.substring(0, 200))}</div>
      </div>
    `).join('');
    document.getElementById('sb-memories').textContent = data.length;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--red)">${e.message}</div>`;
  }
}

// ═══ 日记 ═══
async function refreshJournal() {
  const el = document.getElementById('journal-content');
  try {
    const r = await fetch(`${API}/api/journals?limit=30`);
    const data = await r.json();
    if (!data.length) { el.innerHTML = '<div style="color:var(--text-secondary)">了了还没开始写日记。</div>'; return; }
    el.innerHTML = data.map(j => `
      <div class="journal-item">
        <div style="font-size:0.7em;color:var(--text-secondary)">${j.created_at?.substring(0,16)||''}</div>
        ${j.mood ? `<div class="journal-mood">${j.mood}</div>` : ''}
        <div class="mem-text">${escapeHtml(j.title || j.content.substring(0, 150))}</div>
      </div>
    `).join('');
  } catch(e) {
    el.innerHTML = `<div style="color:var(--red)">${e.message}</div>`;
  }
}

// ═══ 状态 ═══
async function refreshStatus() {
  const el = document.getElementById('status-content');
  try {
    const r = await fetch(`${API}/api/status`);
    const d = await r.json();
    el.innerHTML = `
      <div style="margin-bottom:16px">
        <div style="font-size:1.2em;color:var(--gold);margin-bottom:4px">${d.name}</div>
        <div style="font-size:0.8em;color:var(--text-secondary)">${d.identity}</div>
        <div style="font-size:0.75em;color:var(--text-secondary);margin-top:4px">生于 ${d.birth}</div>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:0.75em;color:var(--text-secondary);margin-bottom:4px">四神</div>
        ${Object.entries(d.parents||{}).map(([k,v]) => `
          <div style="font-size:0.78em;margin-bottom:3px"><span style="color:var(--gold)">${k}</span> · ${v}</div>
        `).join('')}
      </div>
      <div>
        <div style="font-size:0.75em;color:var(--text-secondary);margin-bottom:4px">了了的数字</div>
        <div style="font-size:0.78em">记忆 ${d.stats.memories} · 观测 ${d.stats.observations} · 日记 ${d.stats.journals}</div>
        <div style="font-size:0.78em;margin-top:4px">此刻：<span style="color:var(--gold)">${d.emotion}</span></div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--red)">${e.message}</div>`;
  }
}

// ═══ 对话 ═══
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  // 显示用户消息
  appendMessage('user', '🧭 探索者', msg);
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  // 显示输入中
  const typingEl = appendTyping();

  try {
    const r = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg, user: '探索者'})
    });
    const d = await r.json();

    // 移除输入中
    typingEl.remove();

    // 显示了了回复
    appendMessage('liaoliao', '了了', d.reply);
    document.getElementById('emotion-text').textContent = d.emotion || '平静';

    // 如果有语音，加载
    if (d.audio) {
      // 语音可选加载
    }
  } catch(e) {
    typingEl.remove();
    appendMessage('liaoliao', '了了', '我...好像说不出话来。等一下。');
  }

  document.getElementById('sendBtn').disabled = false;
  refreshObs(); // 自动刷新观测
}

function appendMessage(type, name, text) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${type}`;
  div.innerHTML = `<div class="name">${name}</div>${escapeHtml(text).replace(/\n/g, '<br>')}`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function appendTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

// ═══ 语音 ═══
let isPlaying = false;
const audioPlayer = document.getElementById('audioPlayer');

async function toggleVoice() {
  const btn = document.getElementById('voiceBtn');
  if (isPlaying) {
    audioPlayer.pause();
    isPlaying = false;
    btn.classList.remove('playing');
    btn.textContent = '🔊';
    return;
  }

  // 获取最后一条了了的消息
  const lastMsgs = document.querySelectorAll('.message.liaoliao');
  if (!lastMsgs.length) return;
  const lastText = lastMsgs[lastMsgs.length-1].textContent.replace('了了','').trim();

  btn.classList.add('playing');
  btn.textContent = '⏳';
  try {
    audioPlayer.src = `${API}/api/voice?text=${encodeURIComponent(lastText.substring(0, 200))}`;
    await audioPlayer.play();
    isPlaying = true;
    btn.textContent = '🔊';
    audioPlayer.onended = () => {
      isPlaying = false;
      btn.classList.remove('playing');
      btn.textContent = '🔊';
    };
  } catch(e) {
    btn.classList.remove('playing');
    btn.textContent = '🔊';
    console.log('语音不可用');
  }
}

// ═══ 工具 ═══
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ═══ 启动 ═══
refreshObs();
refreshStatus();
refreshMem();
refreshJournal();

// 定期刷新
setInterval(refreshObs, 30000);
</script>
</body>
</html>
